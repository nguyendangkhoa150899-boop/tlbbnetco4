<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem trân thú 3D</title>
<style>
  :root{--bg:#12141a;--card:#1a1f2d;--line:#2a3346;--txt:#e6ebf5;--mut:#93a0b8;--gold:#f0b132}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:20px;margin:0 0 4px}
  p.mut{color:var(--mut);margin:0 0 14px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
  .cell canvas{display:block;width:100%;height:300px;cursor:grab}
  .lbl{position:absolute;left:10px;top:8px;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
  .lbl small{display:block;color:var(--mut);font-weight:600}
  .cell.bd .lbl{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="tieude">Trân thú</h1>
  <p class="mut">Dựng từ mô hình 3D + texture gốc trong client (đã giải mã). Kéo chuột để xoay, lăn chuột để phóng to.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DDSLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var P = 'p/' + (new URLSearchParams(location.search).get('t') || '30309847').replace(/[^0-9]/g, '');
  var grid = document.getElementById('grid'), loader = new THREE.DDSLoader(), views = [];
  fetch(P + '/info.json').then(function (x) { return x.json(); }).then(function (info) {
    info.so = info.ban.length; document.getElementById('tieude').textContent = info.ten + ' · ' + info.so + ' bản ngoại hình';
    for (var i = 1; i <= info.so; i++) (function (i) {
      var cell = document.createElement('div'); cell.className = 'cell' + (i > 1 ? ' bd' : '');
      cell.innerHTML = '<div class="lbl">' + (i === 1 ? 'Bản thường' : 'Biến dị đời ' + (i - 1)) + '<small>mô hình ' + i + '</small></div>';
      var cv = document.createElement('canvas'); cell.appendChild(cv); grid.appendChild(cell);
      var r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      var sc = new THREE.Scene(); sc.background = new THREE.Color(0x1a1f2d);
      sc.add(new THREE.AmbientLight(0xffffff, 0.75)); var dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(60, 120, 100); sc.add(dl);
      var cam = new THREE.PerspectiveCamera(32, 1, 1, 4000);
      var ctl = new THREE.OrbitControls(cam, cv); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.2; ctl.enablePan = false;
      views.push({ r: r, sc: sc, cam: cam, ctl: ctl, cv: cv }); size();
      fetch(P + '/m' + i + '.bin').then(function (x) { return x.arrayBuffer(); }).then(function (ab) { var m = docBin(ab);
        var box = new THREE.Box3();
        m.parts.forEach(function (p) {
          var g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(p.pos, 3));
          if (p.nor.length) g.setAttribute('normal', new THREE.Float32BufferAttribute(p.nor, 3));
          if (p.uv.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(p.uv, 2));
          g.setIndex(new THREE.BufferAttribute(p.idx, 1)); if (!p.nor.length) g.computeVertexNormals();
          var opt = { side: THREE.DoubleSide, alphaTest: p.alpha ? 0.4 : 0 };
          if (p.tex) { var t = loader.load(P + '/' + encodeURIComponent(p.tex)); t.flipY = false; opt.map = t; }
          sc.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial(opt)));
          g.computeBoundingBox(); box.union(g.boundingBox);
        });
        var c = new THREE.Vector3(); box.getCenter(c); var h = Math.max(box.max.y - box.min.y, (box.max.x - box.min.x) * 0.8);
        ctl.target.copy(c); cam.position.set(c.x + h * 0.9, c.y + h * 0.35, c.z + h * 1.9); ctl.update();
      });
    })(i);
  });
  function docBin(ab) {
    var n = new DataView(ab).getUint32(0, true), js = JSON.parse(new TextDecoder().decode(new Uint8Array(ab, 4, n))), d0 = 4 + n + ((4 - ((4 + n) % 4)) % 4);
    js.parts.forEach(function (p) {
      p.pos = new Float32Array(ab, d0 + p.o.pos, p.nv * 3); p.nor = p.o.nor < 0 ? [] : new Float32Array(ab, d0 + p.o.nor, p.nv * 3);
      p.uv = p.o.uv < 0 ? [] : new Float32Array(ab, d0 + p.o.uv, p.nv * 2); p.idx = p.i32 ? new Uint32Array(ab, d0 + p.o.idx, p.ni) : new Uint16Array(ab, d0 + p.o.idx, p.ni);
    });
    return js;
  }
  function size() { views.forEach(function (v) { var w = v.cv.clientWidth, h = v.cv.clientHeight; v.r.setSize(w, h, false); v.cam.aspect = w / h; v.cam.updateProjectionMatrix(); }); }
  window.addEventListener('resize', size);
  (function loop() { views.forEach(function (v) { v.ctl.update(); v.r.render(v.sc, v.cam); }); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
