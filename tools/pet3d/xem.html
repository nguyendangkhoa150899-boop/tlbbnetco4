<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem trân thú 3D</title>
<style>
  :root{--bg:#12141a;--card:#151826;--line:#2a3346;--txt:#e6ebf5;--mut:#93a0b8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:18px;margin:0 0 8px}
  select,button{background:#232838;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
  .cv{position:relative;height:min(70vh,560px);margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#252c42,#10131b)}
  .cv canvas{display:block;width:100%;height:100%;touch-action:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips button.on{border-color:#f5c542;background:#3a2e0e;color:#ffe08a}
  .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Xem trân thú 3D (local) <select id="pet"></select></h1>
  <div class="cv"><canvas id="cv"></canvas><div class="ld" id="ld">⏳</div></div>
  <div class="chips" id="chips"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DDSLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/p3.js"></script>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '30309847', V = null, idx = {};
  var sel = document.getElementById('pet'), ld = document.getElementById('ld');
  fetch('p/index.json').then(function (r) { return r.json(); }).then(function (j) {
    idx = j; sel.innerHTML = Object.keys(j).map(function (k) { return '<option value="' + k + '"' + (k === t ? ' selected' : '') + '>' + j[k].ten + '</option>'; }).join('');
    mo(t);
  });
  sel.onchange = function () { history.replaceState(null, '', '?t=' + sel.value); mo(sel.value); };
  function mo(id) {
    t = id; if (V) V.dongLai(); var cv = document.getElementById('cv'), moi = cv.cloneNode(); cv.parentNode.replaceChild(moi, cv);
    V = P3V.tao(moi, 'p/' + id + '/'); var so = idx[id].so, h = '';
    for (var k = 1; k <= so; k++) h += '<button data-k="' + k + '">' + (k === 1 ? 'Bản thường' : '🧬 Đời ' + (k - 1)) + '</button>';
    document.getElementById('chips').innerHTML = h;
    [].forEach.call(document.querySelectorAll('#chips button'), function (b) { b.onclick = function () { chon(+b.dataset.k); }; });
    chon(so);
  }
  function chon(k) {
    [].forEach.call(document.querySelectorAll('#chips button'), function (b) { b.classList.toggle('on', +b.dataset.k === k); });
    ld.style.display = ''; V.chon(k).then(function () { ld.style.display = 'none'; }).catch(function (e) { ld.textContent = '❌ ' + e.message; console.error(e); });
  }
  window.__V = function () { return V; };
})();
</script>
</body>
</html>
